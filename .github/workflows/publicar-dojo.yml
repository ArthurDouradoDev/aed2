# Publica o Dojo de Grafos no GitHub Pages.
#
# O catalogo, os esqueletos e o material sao gerados a partir do proprio C
# antes de publicar, entao o site nunca fica dessincronizado do repositorio.
#
# Sao dois jobs independentes de proposito:
#
#   construir   rapido (segundos): gera os dados, confere os 51 exercicios
#               contra o gabarito no gcc e no interpretador, e publica.
#   fidelidade  lento (dez a vinte minutos): roda o teste diferencial, que
#               compara gcc e interpretador nos 51 exercicios para cada erro
#               plantado. Nao trava a publicacao; se ele ficar vermelho, o
#               site ja esta no ar e da para reagir com calma.
#
# ANTES DA PRIMEIRA PUBLICACAO, uma vez so: no GitHub, em
# Settings > Pages > Build and deployment, escolher Source: GitHub Actions.
# O token do workflow nao tem permissao para ligar isso sozinho.
name: publicar o dojo

on:
  push:
    # A branch de desenvolvimento esta aqui para o site ja ficar no ar antes
    # do merge. Depois de juntar na principal, da para tirar esta linha.
    branches: [main, master, claude/dojo-grafos-web-platform-71g96z]
    paths:
      - 'dojo-grafos/**'
      - 'parte-1.md'
      - 'parte-2.md'
      - 'estudo.md'
      - '.github/workflows/publicar-dojo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: gerar os dados a partir do C
        working-directory: dojo-grafos
        run: python3 tools/gerar_web_dados.py

      - name: conferir os 51 exercicios no gcc
        working-directory: dojo-grafos
        run: make conferir PY=python3

      - name: conferir os 51 exercicios no interpretador do navegador
        working-directory: dojo-grafos
        run: node web/teste/suite.js

      # Nao ha actions/configure-pages aqui de proposito: ele so serve para
      # descobrir a URL base, e o site usa caminhos relativos. Sem ele, um
      # Pages ainda nao ligado falha no job de publicar (onde o recado faz
      # sentido) em vez de derrubar a construcao inteira.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dojo-grafos/web

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  fidelidade:
    # Roda em paralelo com o construir. A prova de que treinar no site vale
    # para a prova: o mesmo veredito do gcc nos 51 exercicios, para cada erro
    # que aluno comete de verdade.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: gerar os dados a partir do C
        working-directory: dojo-grafos
        run: python3 tools/gerar_web_dados.py
      - name: comparar o interpretador com o gcc nos 51 exercicios
        working-directory: dojo-grafos
        run: node web/teste/diferencial.js
